[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthesis-station"
version = "0.1.0"
description = "OKF-native research synthesizer for papers, videos, and code."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Eliasz", email = "eliasz@example.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.20.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
okf = "okf_models:main"

[project.urls]
Homepage = "https://github.com/EliaszDev/synthesis-station"
Repository = "https://github.com/EliaszDev/synthesis-station"

[tool.setuptools]
py-modules = ["okf_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --disable-warnings"

[tool.coverage.run]
source = ["okf_models"]
